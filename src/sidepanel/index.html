<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <div id="main-container">
      <!-- header  -->
      <div id="header">
        <h1>Vocab Guru</h1>
      </div>

      <div id="all-words-wrapper">
        <!-- search box  -->
        <div id="search-wrapper">
          <input type="text" placeholder="search word..." />
        </div>

        <!-- fiter tabs  -->
        <div id="filter-tabs-wrapper">
          <ul id="filter-tabs">
            <li>
              <button>All</button>
            </li>
            <li>
              <button>Recent</button>
            </li>
            <li>
              <button>Favourites</button>
            </li>
          </ul>
        </div>

        <!-- divider line  -->
        <div id="dividier-line"></div>

        <!-- words list  -->
        <div id="words-list-wrapper">
          <h2>Your Words List</h2>

          <div id="words-list-inner">
            <ul id="words-list"></ul>
            <button>
              <span>Load More</span>
            </button>
          </div>
        </div>
      </div>

      <!-- word overview wrapper  -->
      <div id="word-overview">
        <h2>Word Overview</h2>

        <!-- word data  -->
        <div id="word-overview-wrapper"></div>
      </div>
    </div>

    <!-- Panel Close button  -->
    <div id="panel-close-button">
      <span>Close</span>
    </div>
    <script src="panel.js"></script>
  </body>
</html>
