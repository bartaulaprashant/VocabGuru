<!doctype html>
<html>
  <head>
    <title>Vocabulary Saver</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 320px;
        margin: 0;
        padding: 16px;
        font-family: Arial, sans-serif;
      }

      h1 {
        font-size: 20px;
        margin-top: 0;
      }

      #search-input {
        width: 100%;
        box-sizing: border-box;
        padding: 8px;
        margin-bottom: 12px;
      }

      #word-list {
        list-style: none;
        padding: 0;
        margin: 0;
      }

      #word-list li {
        padding: 10px;
        margin-bottom: 6px;
        border: 1px solid #ddd;
        border-radius: 6px;
      }
    </style>
  </head>

  <body>
    <h1>Vocabulary Saver</h1>

    <input type="text" placeholder="Enter a word" id="search-input" />
    <ul id="word-list"></ul>

    <script src="./popup.js" type="module"></script>
  </body>
</html>
