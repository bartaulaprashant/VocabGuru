<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vocabulary Saver</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>

  <body>
    <div id="popup-shell">
      <div class="popup-header">
        <div class="brand-wrap">
          <div class="brand-mark">V</div>
          <div>
            <p class="brand-label">Vocab Guru</p>
          </div>
        </div>

        <div class="header-actions">
          <button id="open-sidepanel-button" class="purple-button" type="button">
            Open sidepanel
          </button>
          <button id="manage-extension-button" class="icon-button" type="button" aria-label="Open extension management page">
            ⚙
          </button>
        </div>
      </div>

      <section class="recent-section">
        <div class="section-heading">
          <h2>Recent words</h2>
          <span id="recent-count-badge" class="count-badge">0 / 3</span>
        </div>

        <ul id="word-list" class="word-list"></ul>
      </section>

      <p class="tip-text">💡 Tip: You can also open the sidepanel to view your saved words from extention icon</p>
    </div>

    <script src="./popup.js" type="module"></script>
  </body>
</html>
